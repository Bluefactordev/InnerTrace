<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InnerTrace - Timeline Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            background-color: #0d1117;
            color: #e0e0e0;
            line-height: 1.5;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        .toolbar {
            background: #1a1a2e;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .toolbar-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .toolbar-label {
            color: #a0a0a0;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        select, input {
            background: #2d2d3a;
            color: #e0e0e0;
            border: 1px solid #3d3d3d;
            padding: 8px 12px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 14px;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #764ba2;
        }

        .btn-secondary {
            background: #4a5568;
        }

        .btn-secondary:hover {
            background: #6366f1;
        }

        .timeline-container {
            background: #1a1a2e;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #3d3d3d;
        }

        .timeline-title {
            color: #667eea;
            font-size: 18px;
            font-weight: 600;
        }

        .timeline-info {
            color: #a0a0a0;
            font-size: 12px;
        }

        .timeline-content {
            background: #0d1117;
            border-radius: 4px;
            padding: 15px;
            overflow-x: auto;
            white-space: pre;
            font-size: 13px;
            line-height: 1.6;
        }

        .timeline-line {
            padding: 2px 0;
            border-bottom: 1px solid #1f2937;
        }

        .timeline-line:last-child {
            border-bottom: none;
        }

        .timestamp {
            color: #fbbf24;
            font-weight: 600;
        }

        .event-type {
            color: #61dafb;
            font-weight: 600;
        }

        .event-run-start {
            color: #4ade80;
            font-weight: 700;
        }

        .event-run-end {
            color: #f87171;
            font-weight: 700;
        }

        .event-span-start {
            color: #a78bfa;
            font-weight: 600;
        }

        .event-span-end {
            color: #a78bfa;
            font-weight: 600;
        }

        .event-llm {
            color: #667eea;
            font-weight: 700;
        }

        .event-tool {
            color: #fbbf24;
            font-weight: 600;
        }

        .event-exception {
            color: #f87171;
            font-weight: 700;
            background: rgba(248, 113, 113, 0.1);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #a0a0a0;
        }

        .spinner {
            border: 3px solid #667eea;
            border-left-color: transparent;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #3d1f2d;
            border: 1px solid #f87171;
            color: #f87171;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #a0a0a0;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .search-highlight {
            background: #fbbf24;
            color: #0d1117;
            padding: 2px 4px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <!-- INNERTRACE_EMBEDDED_DEMO -->
    <div class="container">
        <div class="toolbar">
            <div class="toolbar-group">
                <label class="toolbar-label">Run ID:</label>
                <select id="runSelect">
                    <option value="">Select a run...</option>
                </select>
            </div>

            <div class="toolbar-group">
                <label class="toolbar-label">View Mode:</label>
                <select id="viewMode">
                    <option value="full">Full Timeline</option>
                    <option value="compact">Compact (LLM only)</option>
                </select>
            </div>

            <div class="toolbar-group">
                <label class="toolbar-label">Synthesis:</label>
                <select id="synthesisMode">
                    <option value="false">Disabled</option>
                    <option value="true">Enabled</option>
                </select>
            </div>

            <div class="toolbar-group">
                <label class="toolbar-label">Quality:</label>
                <select id="qualityMode">
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>
            </div>

            <div class="toolbar-group">
                <button class="btn" onclick="loadTimeline()">Load Timeline</button>
                <button class="btn btn-secondary" onclick="loadLastRun()">Last Run</button>
            </div>
        </div>

        <div class="timeline-container">
            <div class="timeline-header">
                <div>
                    <span class="timeline-title" id="timelineTitle">Timeline Viewer</span>
                    <span class="timeline-info" id="timelineInfo"></span>
                </div>
                <div>
                    <button class="btn btn-secondary" onclick="copyTimeline()">Copy</button>
                    <button class="btn btn-secondary" onclick="downloadTimeline()">Download</button>
                </div>
            </div>
            <div id="timelineContent" class="timeline-content">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading timeline...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentRunId = null;
        let currentTimeline = [];

        function getEmbeddedDemo() {
            const element = document.getElementById('innertrace-demo-data');
            if (!element) return null;

            try {
                return JSON.parse(element.textContent);
            } catch (error) {
                console.error('Invalid embedded InnerTrace demo data:', error);
                return null;
            }
        }

        // Load available runs on page load. Generated demos embed the same
        // projection payload so the viewer remains useful without a web server.
        document.addEventListener('DOMContentLoaded', function() {
            loadRuns();
        });

        async function loadRuns() {
            const select = document.getElementById('runSelect');
            const embedded = getEmbeddedDemo();

            if (embedded) {
                select.innerHTML = '';
                const option = document.createElement('option');
                option.value = embedded.run.run_id;
                option.textContent = `${embedded.run.run_id.substring(0, 12)}... - ${embedded.run.entrypoint} (${embedded.run.status})`;
                select.appendChild(option);
                currentRunId = embedded.run.run_id;
                currentTimeline = embedded.timeline.timeline;
                renderTimeline(embedded.timeline);
                return;
            }

            try {
                const response = await fetch('/api/innertrace/runs');
                const data = await response.json();

                if (data.status === 'success') {
                    select.innerHTML = '<option value="">Select a run...</option>';

                    data.data.forEach(run => {
                        const option = document.createElement('option');
                        option.value = run.run_id;
                        option.textContent = `${run.run_id.substring(0, 12)}... - ${run.entrypoint} (${run.status})`;
                        if (run.start_formatted) {
                            option.textContent += ` - ${run.start_formatted}`;
                        }
                        select.appendChild(option);
                    });

                    // Auto-select last run if available
                    if (data.data.length > 0) {
                        select.value = data.data[0].run_id;
                        loadTimeline();
                    }
                }
            } catch (error) {
                console.error('Error loading runs:', error);
                select.innerHTML = '<option value="">Error loading runs</option>';
            }
        }

        async function loadTimeline() {
            const runId = document.getElementById('runSelect').value;
            const viewMode = document.getElementById('viewMode').value;
            const synthesis = document.getElementById('synthesisMode').value;
            const quality = document.getElementById('qualityMode').value;

            if (!runId) {
                alert('Please select a run ID');
                return;
            }

            currentRunId = runId;

            const embedded = getEmbeddedDemo();
            if (embedded && embedded.run.run_id === runId) {
                currentTimeline = embedded.timeline.timeline;
                renderTimeline(embedded.timeline);
                return;
            }

            const content = document.getElementById('timelineContent');
            content.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading timeline...</p></div>';

            try {
                let url = `/api/innertrace/timeline/${runId}`;
                const params = new URLSearchParams();
                if (viewMode === 'compact') params.append('compact', 'true');
                if (synthesis === 'true') {
                    params.append('synthesize', 'true');
                    params.append('quality', quality);
                }

                if (params.toString()) {
                    url += '?' + params.toString();
                }

                const response = await fetch(url);
                const data = await response.json();

                if (data.status === 'success') {
                    currentTimeline = data.data.timeline;
                    renderTimeline(data.data);
                } else {
                    content.innerHTML = `<div class="error">Error: ${data.message}</div>`;
                }
            } catch (error) {
                content.innerHTML = `<div class="error">Failed to load timeline: ${error.message}</div>`;
            }
        }

        async function loadLastRun() {
            const embedded = getEmbeddedDemo();
            if (embedded) {
                document.getElementById('runSelect').value = embedded.run.run_id;
                currentRunId = embedded.run.run_id;
                currentTimeline = embedded.timeline.timeline;
                renderTimeline(embedded.timeline);
                return;
            }

            try {
                const response = await fetch('/api/innertrace/last-run');
                const data = await response.json();

                if (data.status === 'success' && data.data) {
                    document.getElementById('runSelect').value = data.data.run_id;
                    loadTimeline();
                } else {
                    alert('No runs found');
                }
            } catch (error) {
                alert('Failed to load last run: ' + error.message);
            }
        }

        function renderTimeline(data) {
            const content = document.getElementById('timelineContent');
            const title = document.getElementById('timelineTitle');
            const info = document.getElementById('timelineInfo');

            // Update header info
            title.textContent = `Timeline: ${data.run_id.substring(0, 20)}...`;
            info.textContent = data.compact ? 'Compact view' : 'Full view';

            if (data.synthesize) {
                info.textContent += ' | Synthesis enabled';
            }

            // Render timeline lines
            const lines = data.timeline.map(line => {
                let className = 'timeline-line';
                let styledLine = line;

                // Add syntax highlighting
                if (line.includes('run.start')) {
                    className += ' event-run-start';
                } else if (line.includes('run.end')) {
                    className += ' event-run-end';
                } else if (line.includes('span.start')) {
                    className += ' event-span-start';
                } else if (line.includes('span.end')) {
                    className += ' event-span-end';
                } else if (line.includes('llm.call')) {
                    className += ' event-llm';
                } else if (line.includes('tool.call')) {
                    className += ' event-tool';
                } else if (line.includes('exception')) {
                    className += ' event-exception';
                }

                // Highlight timestamps
                styledLine = styledLine.replace(
                    /\[\d{2}:\d{2}:\d{2}\.\d{3}\]/g,
                    '<span class="timestamp">$&</span>'
                );

                // Highlight event types
                styledLine = styledLine.replace(
                    /(run\.(start|end)|span\.(start|end)|llm\.call\.(start|end)|tool\.call\.(start|end)|exception)/g,
                    '<span class="event-type">$1</span>'
                );

                return `<div class="${className}">${styledLine}</div>`;
            });

            content.innerHTML = lines.join('');
        }

        function copyTimeline() {
            if (currentTimeline.length === 0) {
                alert('No timeline loaded');
                return;
            }

            const text = currentTimeline.join('\n');
            navigator.clipboard.writeText(text).then(() => {
                alert('Timeline copied to clipboard!');
            }).catch(err => {
                alert('Failed to copy: ' + err.message);
            });
        }

        function downloadTimeline() {
            if (currentTimeline.length === 0) {
                alert('No timeline loaded');
                return;
            }

            const text = currentTimeline.join('\n');
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `timeline_${currentRunId}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
