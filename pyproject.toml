[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "innertrace"
version = "0.3.0"
description = "Reconstruct decisions, tool calls, retries, and failures in LLM and agent runs"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Bluefactor", email = "dev@bluefactor.it" }
]

keywords = [
    "tracing",
    "llm",
    "observability",
    "debugging",
    "event-sourcing",
    "storytelling",
    "agents",
    "ai"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Logging",
    "Topic :: Software Development :: Libraries"
]

dependencies = [
    "pydantic>=1.10,<3",
    "ulid-py>=1.1.0"
]


[project.optional-dependencies]
synthesis = [
    "aiohttp>=3.8,<4"
]

dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pytest>=7,<9",
    "pytest-asyncio>=0.21",
    "pytest-cov>=5",
    "twine>=5"
]


[project.scripts]
innertrace = "innertrace.tracing.cli:main"


[project.urls]
Homepage = "https://github.com/Bluefactordev/InnerTrace"
Changelog = "https://github.com/Bluefactordev/InnerTrace/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Bluefactordev/InnerTrace#readme"
Repository = "https://github.com/Bluefactordev/InnerTrace"
Issues = "https://github.com/Bluefactordev/InnerTrace/issues"


[tool.setuptools.packages.find]
where = ["."]
include = ["innertrace*"]
exclude = ["tests*", "examples*", "docs*"]


[tool.setuptools.package-data]
innertrace = [
    "py.typed",
    "templates/*.html",
    "tracing/.env.example",
    "tracing/config.json.example",
]


[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
