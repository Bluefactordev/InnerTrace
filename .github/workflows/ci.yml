name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: innertrace --help
      - run: python examples/agent_failure_demo.py --output-dir "${RUNNER_TEMP}/innertrace-demo"

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify wheel contents
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          required = {
              "innertrace/py.typed",
              "innertrace/templates/index.html",
              "innertrace/templates/runs.html",
              "innertrace/templates/timeline.html",
              "innertrace/tracing/.env.example",
              "innertrace/tracing/config.json.example",
          }
          assert required <= names, required - names
          PY
      - name: Smoke-test installed wheel
        run: |
          python -m venv "${RUNNER_TEMP}/innertrace-wheel"
          "${RUNNER_TEMP}/innertrace-wheel/bin/pip" install dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/innertrace-wheel/bin/python" -c \
            'import innertrace; assert innertrace.__version__ == "0.3.0"; assert innertrace.get_template_text("timeline.html")'
          "${RUNNER_TEMP}/innertrace-wheel/bin/innertrace" --help
          cd "${GITHUB_WORKSPACE}"
          "${RUNNER_TEMP}/innertrace-wheel/bin/python" examples/agent_failure_demo.py \
            --output-dir "${RUNNER_TEMP}/innertrace-wheel-demo"
